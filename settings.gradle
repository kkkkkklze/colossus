// Repositories used to resolve the Gradle plugins themselves.
// China-friendly mirrors come first, official sources are kept as fallback.
pluginManagement {
    repositories {
        // NeoForge / ModDevGradle plugin artifacts (official CDN of maven.neoforged.net).
        maven {
            name = 'NeoForged-CDN'
            url = 'https://neoforged.forgecdn.net/releases'
        }
        // BMCLAPI mirror of the Forge/NeoForge mavens.
        maven {
            name = 'BMCLAPI'
            url = 'https://bmclapi2.bangbang93.com/maven/'
        }
        // MinecraftForge maven (forgeflower / installertools, etc.).
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        // Aliyun mirrors of the Gradle plugin portal and Maven Central.
        maven {
            name = 'Aliyun-GradlePlugin'
            url = 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        maven {
            name = 'Aliyun-Central'
            url = 'https://maven.aliyun.com/repository/public'
        }
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'forge-1.20.1-mod'
