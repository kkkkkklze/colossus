name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      # —— 引擎三层验证（方法学取自姊妹工程，全部免 EULA/非 ASCII 路径无关）——
      # 1) 状态机/帧表内核确定性自检（纯逻辑 JavaExec）
      # 2) GameTest 声明数下限（堵"0 条测试假绿"通道）
      # 3) 真游戏服务端回归（击杀路径等 MC 生命周期分支）
      - name: Engine self test
        run: ./gradlew colossusSelfTest

      - name: GameTest count floor
        run: ./gradlew gameTestAudit

      - name: Game tests (real server)
        run: ./gradlew runGameTestServer
